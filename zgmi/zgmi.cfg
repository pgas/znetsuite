# ZGMI.CFG - Configuration File for ZGMI (ZNetSuite Gemini Client)
# Place on current CP/M drive or A:ZGMI.CFG (or specify via -c <file>)

# RomWBW Character I/O serial unit connected to the AT Wi-Fi bridge
unit = 1

# Default home URL when ZGMI is invoked without a URL argument
home = gemini://geminiprotocol.net

# Temporary spool file created lazily ONLY when a document exceeds RAM.
# Tip: Point to a RAM disk drive (e.g. A:ZGMI.$$$ or B:ZGMI.$$$) for
# instant scrollback on huge pages.
spool_file = ZGMI.$$$

# Maximum spool file size in KB (0 = disable disk spooling, RAM only)
max_spool = 128

# In-memory sliding window size in KB (0 = auto-size to available CP/M TPA)
ram_window = 0

# Use VT100 hardware scrolling region (ESC [ r) for 1-line j/k scrolling
# Set to 0 if your terminal emulator does not support VT100 scroll regions.
hw_scroll = 1
