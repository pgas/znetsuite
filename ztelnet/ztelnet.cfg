# ZTELNET.CFG - Configuration File for ZTELNET (ZNetSuite Telnet Client)
# Place on current CP/M drive or A:ZTELNET.CFG (or specify via -c <file>)

# RomWBW Character I/O serial unit connected to the Hayes AT modem / bridge
unit = 1

# Default TCP port when not specified on the command line
port = 23

# Terminal type reported during RFC 1091 TTYPE negotiation
term = VT100

# Local character echo (0 = off / negotiated via Telnet WILL ECHO, 1 = on)
echo = 0

# Send CR+LF instead of CR on Enter (0 = CR, 1 = CRLF)
crlf = 0
